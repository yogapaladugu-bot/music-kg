<!DOCTYPE html>
<!--
  This is the webpage's structure. HTML names the controls and containers;
  style.css controls appearance; the JavaScript files load and operate the graph.
  An element's `id` is the name JavaScript uses with getElementById().
-->
<html>
    <head>
          <!-- UTF-8 supports artist names and titles from many languages. -->
            <meta charset="UTF-8">
          <!-- Load our visual rules before displaying the page. -->
          <link rel="stylesheet" href="style.css">
          <title>Music Knowledge Graph</title>
    </head>

    <body>
        <!-- The top section introduces the database-backed music graph. -->
        <center>
        <h1>Music Knowledge Graph</h1>
        <p class="entityIntro">Choose a section to explore different aspects of music</p>
        </center>
        <!-- Each link opens a focused, bounded view for one database label. -->
        <nav class="labelDirectory" aria-label="Browse the graph by node type">
          <a href="artist.html">Artists</a>
          <a href="recording.html">Recordings</a>
          <a href="work.html">Works</a>
          <a href="label.html">Labels</a>
          <a href="release-group.html">Release Groups</a>
          <a href="release.html">Releases</a>
          <a href="medium.html">Mediums</a>
          <a href="track.html">Tracks</a>
          <a href="instrument.html">Instruments</a>
          <a href="genre.html">Genres</a>
          <!-- This mixed view shows how all of the entity types connect. -->
          <a href="relationships.html">Relationships</a>
        </nav>
        <!-- Individual label pages load bounded graph data. The home page does
             not query Samyama, so merely opening it is always lightweight. -->
    </body>
</html>
